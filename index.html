<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux Wiki - Enterprise Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #101920 0%, #1a2a35 100%);
            --glass-bg: rgba(26, 42, 53, 0.8);
            --accent: #e67e22; 
            --text-main: #ecf0f1; 
            --text-muted: #bdc3c7;
            --border: rgba(255, 255, 255, 0.08);
            --code-inline-bg: rgba(52, 73, 94, 0.4);
            --code-inline-text: #bdc3c7;
        }

        body { 
            display: flex; margin: 0; 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            height: 100vh; overflow: hidden; 
        }
        
        #sidebar { 
            width: 320px; height: calc(100vh - 40px); 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px);
            margin: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 30px 20px; box-sizing: border-box; 
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center; /* Centra elementos horizontalmente */
        }

        #sidebar h2 { 
            font-size: 1.2rem; font-weight: 700; color: white;
            margin-bottom: 25px; letter-spacing: 0.5px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
            width: 100%; /* Para que el borde lateral se vea bien */
        }

        /* Buscador Centrado y más estético */
        #searchBar { 
            width: 90%; 
            padding: 12px 15px; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--border); 
            color: white; border-radius: 10px; margin-bottom: 30px; 
            outline: none; transition: 0.3s;
            text-align: center; /* Texto de búsqueda centrado */
        }
        #searchBar:focus { border-color: var(--accent); background: rgba(0, 0, 0, 0.5); }

        #menu-index { width: 100%; }

        .nav-item { 
            display: block; color: var(--text-muted); padding: 10px 15px; 
            font-size: 13.5px; text-decoration: none; cursor: pointer; 
            border-radius: 8px; transition: 0.2s;
        }
        .nav-item:hover { background: rgba(230, 126, 34, 0.1); color: var(--accent); padding-left: 20px; }
        
        .cat-title { 
            color: #fff; font-weight: 700; margin-top: 25px; 
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px;
            opacity: 0.7; padding-left: 10px;
        }

        #content-wrapper { 
            flex-grow: 1; height: 100vh; overflow-y: auto; 
            padding: 20px 40px 300px 20px; scroll-behavior: smooth; 
        }
        
        #md-render { 
            max-width: 900px; margin: auto; 
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            padding: 50px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .markdown-body { background: transparent !important; color: var(--text-main) !important; font-size: 15px !important; line-height: 1.7 !important; }
        .markdown-body h2 { 
            color: #fff !important; border-bottom: 2px solid var(--accent) !important; 
            padding-bottom: 12px; font-weight: 700 !important; margin-top: 50px !important;
        }

        .markdown-body pre { 
            background: rgba(0, 0, 0, 0.5) !important; 
            border: 1px solid var(--border) !important; 
            border-radius: 12px !important; padding: 25px !important; 
            position: relative;
        }

        .markdown-body code { 
            color: var(--code-inline-text) !important; 
            background: var(--code-inline-bg) !important; 
            padding: 0.2em 0.5em !important;
            border-radius: 6px !important;
            font-family: 'Consolas', monospace !important;
        }
        
        .markdown-body pre code {
            color: #e6edf3 !important;
            background: transparent !important;
            padding: 0 !important;
        }

        .copy-btn { 
            position: absolute; right: 15px; top: 15px; 
            background: var(--accent); color: white; border: none; 
            padding: 6px 12px; border-radius: 6px; cursor: pointer; 
            font-weight: 600; font-size: 10px; text-transform: uppercase;
        }

        #toTop {
            display: none; position: fixed; bottom: 40px; right: 40px; 
            background: var(--accent); color: white; border: none;
            width: 45px; height: 45px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); font-size: 18px;
            transition: 0.3s;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>WIKI LINUXERO</h2>
    <input type="text" id="searchBar" placeholder="Buscar comando..." onkeyup="filterMenu()">
    <div id="menu-index"></div>
</div>

<div id="content-wrapper">
    <div id="md-render" class="markdown-body">Cargando documentación...</div>
</div>

<button id="toTop" onclick="scrollToTop()">↑</button>

<script>
    const contentWrapper = document.getElementById('content-wrapper');

    fetch('comandos.md')
        .then(response => response.text())
        .then(data => {
            document.getElementById('md-render').innerHTML = marked.parse(data);
            generateMenu();
            addCopyButtons();
        });

    function generateMenu() {
        const headings = document.querySelectorAll('#md-render h2, #md-render h3');
        const menu = document.getElementById('menu-index');
        headings.forEach((heading, index) => {
            const id = 'section-' + index;
            heading.id = id;
            const link = document.createElement('a');
            link.className = heading.tagName === 'H3' ? 'cat-title' : 'nav-item';
            link.innerText = heading.innerText;
            link.onclick = (e) => {
                e.preventDefault();
                document.getElementById(id).scrollIntoView({behavior: "smooth"});
            };
            menu.appendChild(link);
        });
    }

    function filterMenu() {
        let input = document.getElementById('searchBar').value.toLowerCase();
        document.querySelectorAll('.nav-item').forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(input) ? "block" : "none";
        });
    }

    function addCopyButtons() {
        document.querySelectorAll('pre').forEach(block => {
            const btn = document.createElement('button');
            btn.innerText = "COPIAR";
            btn.className = "copy-btn";
            btn.onclick = () => {
                navigator.clipboard.writeText(block.querySelector('code').innerText).then(() => {
                    btn.innerText = "COPIADO";
                    setTimeout(() => btn.innerText = "COPIAR", 2000);
                });
            };
            block.appendChild(btn);
        });
    }

    contentWrapper.onscroll = () => {
        document.getElementById("toTop").style.display = contentWrapper.scrollTop > 500 ? "block" : "none";
    };

    function scrollToTop() {
        contentWrapper.scrollTo({top: 0, behavior: 'smooth'});
    }
</script>
</body>
</html>
