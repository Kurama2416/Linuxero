<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linuxero Wiki - Soluciones y Comandos</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        :root { 
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass-bg: rgba(30, 41, 59, 0.7);
            --accent: #f97316; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --code-bg: #0f172a;
        }
        body { 
            margin: 0; padding: 0;
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text-main); 
            font-family: 'Inter', system-ui, sans-serif; 
            height: 100vh; width: 100vw;
            display: flex; overflow: hidden;
        }
        #menu-toggle {
            display: none; position: fixed; top: 20px; left: 0; 
            z-index: 2000; background: var(--accent); color: white;
            border: none; padding: 10px 15px; 
            border-radius: 0 8px 8px 0; cursor: pointer;
            transition: left 0.3s ease, border-radius 0.3s ease; 
            font-weight: 600; font-size: 14px;
        }
        #menu-toggle.active { 
            left: 320px; 
            border-radius: 0 50px 50px 0; 
            padding: 12px 12px;
        }
        #sidebar { 
            width: 320px; height: 100vh;
            background: var(--glass-bg); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            padding: 30px 20px; box-sizing: border-box; 
            overflow-y: auto; display: flex; flex-direction: column;
            flex-shrink: 0; transition: transform 0.3s ease;
        }
        #sidebar h2 { 
            font-size: 1.1rem; font-weight: 800; color: #fff;
            margin-bottom: 20px; border-left: 4px solid var(--accent);
            padding-left: 15px; text-transform: uppercase; cursor: pointer;
        }
        .search-container { position: relative; width: 100%; margin-bottom: 25px; }
        #searchBar { 
            width: 100%; padding: 12px 35px 12px 12px; 
            background: rgba(0, 0, 0, 0.2); border: 1px solid var(--border); 
            color: white; border-radius: 10px; outline: none; box-sizing: border-box;
        }
        #clearSearch {
            display: none; position: absolute; right: 10px; top: 50%;
            transform: translateY(-50%); background: none; border: none;
            color: var(--text-muted); font-size: 20px; cursor: pointer;
        }
        .nav-item { 
            display: block; color: var(--text-muted); padding: 10px 12px; 
            font-size: 14px; text-decoration: none; cursor: pointer; 
            border-radius: 8px; transition: all 0.3s ease; margin-bottom: 4px;
        }
        .text-white { color: #ffffff !important; font-weight: 600; }
        .nav-item:hover { background: rgba(249, 115, 22, 0.1); padding-left: 20px; }
        #content-wrapper { 
            flex-grow: 1; height: 100vh; overflow-y: auto; 
            padding: 40px; box-sizing: border-box;
        }
        #md-render { 
            max-width: 900px; margin: 0 auto; 
            background: var(--glass-bg); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px; border: 1px solid var(--border);
        }
        .markdown-body { background: transparent !important; color: var(--text-main) !important; }
        .markdown-body pre { 
            background: var(--code-bg) !important; 
            position: relative; padding: 0 !important; 
            border-radius: 12px !important; overflow: hidden;
        }
        .markdown-body pre code { display: block; padding: 25px !important; overflow-x: auto; }
        .copy-container { 
            position: sticky; right: 10px; top: 10px; float: right; 
            z-index: 10; display: flex; flex-direction: column; align-items: flex-end;
        }
        .copy-btn { 
            background: rgba(255, 255, 255, 0.1); color: var(--text-muted); 
            border: 1px solid var(--border); padding: 8px; border-radius: 8px; 
            cursor: pointer; transition: all 0.2s;
        }
        .copy-btn.success { border-color: var(--accent); color: var(--accent); background: rgba(249, 115, 22, 0.1); }
        .copy-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .copy-btn .icon-check, .copy-btn.success .icon-copy { display: none; }
        .copy-btn.success .icon-check { display: block; }
        .copy-feedback { 
            position: absolute; right: 45px; top: 8px;
            background: var(--accent); color: white; padding: 4px 8px;
            border-radius: 4px; font-size: 10px; font-weight: bold;
            white-space: nowrap; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .copy-feedback.show { opacity: 1; transform: translateX(-5px); }
        #toTop {
            display: none; position: fixed; bottom: 30px; right: 30px; 
            background: var(--accent); color: white; border: none;
            width: 45px; height: 45px; border-radius: 50%; cursor: pointer;
        }
        @media (max-width: 1024px) {
            #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); z-index: 1500; }
            #sidebar.active { transform: translateX(0); }
            #menu-toggle { display: block; }
            #content-wrapper { padding: 80px 15px; }
            #md-render { padding: 30px 20px; border-radius: 15px; }
        }
    </style>
</head>
<body>
<button id="menu-toggle" onclick="toggleSidebar()">☰ Menú</button>
<div id="sidebar">
    <h2 onclick="loadMarkdown('README.md')">LINUXERO WIKI</h2>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="🔍 Buscar..." onkeyup="filterMenu()">
        <button id="clearSearch" onclick="clearSearchField()">&times;</button>
    </div>
    <div id="menu-index"></div>
</div>
<div id="content-wrapper">
    <div id="md-render" class="markdown-body">Cargando documentación...</div>
</div>
<button id="toTop" onclick="scrollToTop()">↑</button>
<script>
    const contentWrapper = document.getElementById('content-wrapper');
    const mdRender = document.getElementById('md-render');
    const sidebar = document.getElementById('sidebar');

    function toggleSidebar() { 
        sidebar.classList.toggle('active');
        const btn = document.getElementById('menu-toggle');
        btn.classList.toggle('active');
        btn.innerHTML = sidebar.classList.contains('active') ? '❮' : '☰ Menú';
    }

    function loadMarkdown(url) {
        fetch(url + `?t=${new Date().getTime()}`)
            .then(res => res.ok ? res.text() : Promise.reject())
            .then(data => {
                mdRender.innerHTML = marked.parse(data);
                generateMenu();
                addCopyButtons();
                handleInternalLinks();
                if (window.innerWidth <= 1024) {
                    sidebar.classList.remove('active');
                    const btn = document.getElementById('menu-toggle');
                    btn.classList.remove('active');
                    btn.innerHTML = '☰ Menú';
                }
                contentWrapper.scrollTop = 0;
            })
            .catch(() => { mdRender.innerHTML = "<h2>Error</h2><p>No se pudo cargar el archivo.</p>"; });
    }

    function handleInternalLinks() {
        mdRender.querySelectorAll('a').forEach(link => {
            const href = link.getAttribute('href');
            if (href && href.endsWith('.md')) {
                link.onclick = (e) => { e.preventDefault(); loadMarkdown(href); };
            }
        });
    }

    function generateMenu() {
        const headings = document.querySelectorAll('#md-render h2');
        const menu = document.getElementById('menu-index');
        menu.innerHTML = '';
        headings.forEach((heading, index) => {
            const id = 'section-' + index;
            heading.id = id;
            const link = document.createElement('a');
            link.className = 'nav-item';
            link.innerHTML = `<span class="text-white">${heading.innerText}</span>`;
            link.onclick = (e) => {
                e.preventDefault();
                contentWrapper.scrollTo({ top: document.getElementById(id).offsetTop - 20, behavior: "smooth" });
                if (window.innerWidth <= 1024) toggleSidebar();
            };
            menu.appendChild(link);
        });
    }

    function addCopyButtons() {
        document.querySelectorAll('pre').forEach(block => {
            if (block.querySelector('.copy-container')) return;
            const container = document.createElement('div');
            container.className = "copy-container";
            const feedback = document.createElement('span');
            feedback.className = "copy-feedback";
            feedback.innerText = "¡Copiado!"; 
            const btn = document.createElement('button');
            btn.className = "copy-btn";
            btn.innerHTML = `<svg class="icon-copy" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><svg class="icon-check" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
            btn.onclick = () => {
                const code = block.querySelector('code').innerText.split('\n').map(l => l.split('#')[0].trim()).filter(l => l !== "").join('\n');
                navigator.clipboard.writeText(code).then(() => {
                    btn.classList.add('success');
                    feedback.classList.add('show');
                    setTimeout(() => { btn.classList.remove('success'); feedback.classList.remove('show'); }, 2000);
                });
            };
            container.appendChild(feedback);
            container.appendChild(btn);
            block.insertBefore(container, block.firstChild);
        });
    }

    function filterMenu() {
        let filter = document.getElementById('searchBar').value.toLowerCase();
        document.getElementById('clearSearch').style.display = filter ? 'block' : 'none';
        document.querySelectorAll('.nav-item').forEach(item => {
            item.style.display = item.innerText.toLowerCase().includes(filter) ? "block" : "none";
        });
    }

    function clearSearchField() { document.getElementById('searchBar').value = ''; filterMenu(); }
    function scrollToTop() { contentWrapper.scrollTo({top: 0, behavior: 'smooth'}); }
    contentWrapper.onscroll = () => { document.getElementById("toTop").style.display = contentWrapper.scrollTop > 400 ? "block" : "none"; };

    loadMarkdown('README.md');
</script>
</body>
</html>
