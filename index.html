<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linuxero Wiki</title>

   
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f172a;
            color: white;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        
        #sidebar {
            width: 260px;
            background: #020617;
            padding: 20px 16px;
            overflow-y: auto;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 1000;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            border-right: 1px solid #1e293b;
        }

        #sidebar.active {
            transform: translateX(0);
        }

        
        #menu-toggle {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1100;
            background: #f97316;
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.3s;
        }

        #menu-toggle:hover {
            background: #ea580c;
        }

        #menu-toggle span {
            display: block;
            width: 20px;
            height: 2px;
            background: white;
            margin: 2px 0;
            transition: 0.3s;
        }

        #menu-toggle.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        #menu-toggle.active span:nth-child(2) {
            opacity: 0;
        }

        #menu-toggle.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        
        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        #sidebar-overlay.active {
            display: block;
        }

        #content {
            flex: 1;
            overflow-y: auto;
            padding: 48px 64px;
            margin-left: 0;
            transition: margin-left 0.3s ease;
            background: #0f172a;
        }

        
        @media (min-width: 1024px) {
            #sidebar {
                width: 260px;
                transform: translateX(0);
                position: relative;
            }

            #menu-toggle {
                display: none;
            }

            #sidebar-overlay {
                display: none !important;
            }

            #content {
                margin-left: 0;
                padding: 56px 80px;
            }
        }

        
        #md {
            max-width: 1100px;
            margin: 0 auto;
            background: #1e293b;
            padding: 48px 56px;
            border-radius: 16px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.3);
            border: 1px solid #334155;
        }

      
        .search-container {
            position: relative;
            margin: 20px 0 24px 0;
            width: 100%;
        }

        #search {
            width: 100%;
            padding: 10px 36px 10px 14px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        #search:focus {
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249,115,22,0.2);
        }

        #search::placeholder {
            color: #64748b;
            font-style: italic;
        }

        .clear-search {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            display: none;
            transition: color 0.2s;
            line-height: 1;
        }

        .clear-search:hover {
            color: #f97316;
        }

        .clear-search.visible {
            display: block;
        }

        
        #sidebar h3 {
            color: #f97316;
            font-size: 22px;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 0 4px;
            font-weight: 600;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #sidebar h3::before {
            content: "🐧";
            font-size: 20px;
        }

        
        .nav-item {
            display: block;
            padding: 8px 12px;
            margin: 4px 0;
            color: #94a3b8;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border-left: 2px solid transparent;
        }

        .nav-item:hover {
            background: rgba(249,115,22,0.15);
            color: white;
            border-left-color: #f97316;
        }

        .nav-item.active {
            background: rgba(249,115,22,0.2);
            color: white;
            font-weight: 500;
            border-left-color: #f97316;
        }

       
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
            font-size: 16px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 24px;
            height: 24px;
            margin-left: 12px;
            border: 2px solid #f97316;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

       
        .error {
            text-align: center;
            padding: 60px 40px;
            color: #ef4444;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #ef4444;
        }

        .error button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .error button:hover {
            background: #ea580c;
        }

        
        .code-block-wrapper {
            position: relative;
            margin: 24px 0;
        }

        pre {
            background: #0f172a !important;
            border-radius: 8px;
            padding: 16px !important;
            margin: 0 !important;
            border: 1px solid #334155;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        pre code {
            font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
            display: block;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            border: 1px solid rgba(249, 115, 22, 0.3);
            min-width: 85px;
            justify-content: center;
            pointer-events: auto;
        }

        .copy-btn i {
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #2d3a4f;
            color: white;
            border-color: #f97316;
        }

        .copy-btn.copied {
            background: #059669;
            color: white;
            border-color: #059669;
        }

        @media (max-width: 768px) {
            .copy-btn {
                opacity: 1;
                background: #1e293b;
                top: 8px;
                right: 8px;
                padding: 5px 10px;
                font-size: 11px;
            }
        }

        @media (hover: hover) {
            .copy-btn {
                opacity: 0;
            }
            .code-block-wrapper:hover .copy-btn {
                opacity: 1;
            }
        }

      
        .back-to-top {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #f97316;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s, transform 0.2s;
            border: none;
            box-shadow: 0 4px 10px rgba(249,115,22,0.3);
            font-size: 20px;
            z-index: 900;
        }

        .back-to-top.visible {
            opacity: 1;
        }

        .back-to-top:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(249,115,22,0.4);
        }

       
        #sidebar::-webkit-scrollbar, 
        #content::-webkit-scrollbar {
            width: 6px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #020617;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 3px;
        }

        #content::-webkit-scrollbar-track {
            background: #0f172a;
        }

        #content::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 3px;
        }

        /* Resultados de búsqueda */
        #no-results {
            padding: 20px 12px;
            color: #94a3b8;
            text-align: center;
            font-size: 14px;
            background: #1e293b;
            border-radius: 8px;
            margin-top: 16px;
            border: 1px dashed #f97316;
        }

        
        .markdown-body {
            background-color: transparent !important;
            color: #e2e8f0 !important;
        }

        .markdown-body h1 {
            color: #f97316 !important;
            border-bottom: 2px solid #334155 !important;
            padding-bottom: 12px !important;
            font-size: 2.2em !important;
        }

        .markdown-body h2 {
            color: #f97316 !important;
            margin-top: 32px !important;
            margin-bottom: 20px !important;
            font-size: 1.8em !important;
            border-bottom: 1px solid #334155 !important;
            padding-bottom: 8px !important;
        }

        .markdown-body h3 {
            color: #fbbf24 !important;
            font-size: 1.4em !important;
            margin-top: 24px !important;
        }

        .markdown-body p {
            line-height: 1.7 !important;
            font-size: 16px !important;
            color: #cbd5e1 !important;
        }

        .markdown-body ul, .markdown-body ol {
            padding-left: 24px !important;
            color: #cbd5e1 !important;
        }

        .markdown-body li {
            margin: 6px 0 !important;
        }

        .markdown-body a {
            color: #f97316 !important;
            text-decoration: none !important;
            border-bottom: 1px dashed #f97316 !important;
        }

        .markdown-body a:hover {
            border-bottom-style: solid !important;
        }

        .markdown-body code:not(pre code) {
            background: #334155 !important;
            color: #fbbf24 !important;
            padding: 2px 6px !important;
            border-radius: 4px !important;
            font-size: 0.9em !important;
        }

        .markdown-body blockquote {
            border-left-color: #f97316 !important;
            background: #1e293b !important;
            padding: 12px 20px !important;
            color: #94a3b8 !important;
        }

        .markdown-body hr {
            background: #334155 !important;
        }

        .markdown-body table {
            border-color: #334155 !important;
        }

        .markdown-body th {
            background: #1e293b !important;
            color: white !important;
        }

        .markdown-body td {
            background: #0f172a !important;
            color: #cbd5e1 !important;
        }
    </style>
</head>
<body>


<button id="menu-toggle" onclick="App.toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</button>


<div id="sidebar-overlay" onclick="App.closeMenu()"></div>

<div id="container">
    <div id="sidebar">
        <h3 onclick="App.load('README.md'); App.closeMenu();" style="cursor:pointer;">Linuxero</h3>
        
       
        <div class="search-container">
            <input type="text" id="search" placeholder="Buscar sección..." oninput="App.handleSearchInput(this)">
            <button class="clear-search" id="clear-search" onclick="App.clearSearch()" aria-label="Limpiar búsqueda">✕</button>
        </div>
        
        <div id="menu"></div>
    </div>

    <div id="content">
        <div id="md" class="markdown-body"></div>
        <button class="back-to-top" onclick="App.scrollToTop()" id="back-to-top">↑</button>
    </div>
</div>

<script>
const App = {
    cache: {},
    current: "",
    searchTimeout: null,

   
    toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('menu-toggle').classList.toggle('active');
        document.getElementById('sidebar-overlay').classList.toggle('active');
    },

    closeMenu() {
        if (window.innerWidth < 1024) {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('menu-toggle').classList.remove('active');
            document.getElementById('sidebar-overlay').classList.remove('active');
        }
    },

    scrollToTop() {
        document.getElementById('content').scrollTo({ top: 0, behavior: 'smooth' });
    },

    
    initScrollListener() {
        const content = document.getElementById('content');
        const backBtn = document.getElementById('back-to-top');
        
        content.addEventListener('scroll', () => {
            if (content.scrollTop > 300) {
                backBtn.classList.add('visible');
            } else {
                backBtn.classList.remove('visible');
            }
        });
    },

    
    handleSearchInput(input) {
        const clearBtn = document.getElementById('clear-search');
        
        if (input.value.length > 0) {
            clearBtn.classList.add('visible');
        } else {
            clearBtn.classList.remove('visible');
        }
        
        clearTimeout(this.searchTimeout);
        this.searchTimeout = setTimeout(() => this.filter(), 300);
    },

    
    clearSearch() {
        const searchInput = document.getElementById('search');
        searchInput.value = '';
        document.getElementById('clear-search').classList.remove('visible');
        this.filter();
        searchInput.focus();
    },

    async load(file) {
        this.current = file;
        history.pushState({}, "", "#" + file);

        this.closeMenu();

        if (this.cache[file]) {
            this.render(this.cache[file]);
            return;
        }

        document.getElementById("md").innerHTML = '<div class="loading">Cargando documento...</div>';

        try {
            let filePath = file;
            if (!filePath.endsWith('.md')) {
                filePath += '.md';
            }

            const res = await fetch(filePath);
            
            if (!res.ok) {
                if (res.status === 404) {
                    throw new Error(`Archivo "${filePath}" no encontrado`);
                }
                throw new Error(`Error ${res.status}: ${res.statusText}`);
            }

            const text = await res.text();
            
            const cleanMd = DOMPurify.sanitize(text, { 
                USE_PROFILES: { markdown: true } 
            });
            
            this.cache[file] = cleanMd;
            this.render(cleanMd);

        } catch (error) {
            document.getElementById("md").innerHTML = `
                <div class="error">
                    <h2>❌ Error al cargar</h2>
                    <p>${error.message}</p>
                    <p style="font-size: 14px; margin-top: 8px;">Verifica que el archivo existe en la carpeta.</p>
                    <button onclick="App.load('README.md')">📄 Volver al inicio</button>
                </div>
            `;
        }
    },

    render(md) {
        try {
            const html = marked.parse(md, {
                breaks: true,
                gfm: true
            });
            
            const cleanHtml = DOMPurify.sanitize(html, {
                USE_PROFILES: { html: true }
            });
            
            document.getElementById("md").innerHTML = cleanHtml;

            this.generateMenu();
            this.handleLinks();
            this.addCopyButtons();
            
            document.getElementById('content').scrollTop = 0;
            this.clearSearch();

        } catch (error) {
            console.error('Error al renderizar:', error);
            document.getElementById("md").innerHTML = `
                <div class="error">
                    <h2>Error al procesar el documento</h2>
                    <p>${error.message}</p>
                </div>
            `;
        }
    },

    generateMenu() {
        const menu = document.getElementById("menu");
        menu.innerHTML = "";

        const headers = document.querySelectorAll("#md h2");
        
        if (headers.length === 0) {
            menu.innerHTML = '<div style="color: #94a3b8; padding: 12px; font-style: italic;">Sin secciones</div>';
            return;
        }

        headers.forEach((h2, i) => {
            const sectionId = `seccion-${i}-${h2.innerText.toLowerCase().replace(/\s+/g, '-')}`;
            h2.id = sectionId;

            const item = document.createElement("div");
            item.className = "nav-item";
            item.innerText = h2.innerText;
            item.title = h2.innerText;

            item.onclick = () => {
                document.getElementById("content").scrollTo({
                    top: h2.offsetTop - 20,
                    behavior: "smooth"
                });
                
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                item.classList.add('active');
                
                if (window.innerWidth < 1024) {
                    this.closeMenu();
                }
            };

            menu.appendChild(item);
        });
    },

    handleLinks() {
        document.querySelectorAll("#md a").forEach(link => {
            const href = link.getAttribute("href");

            if (href && href.endsWith(".md")) {
                link.onclick = (e) => {
                    e.preventDefault();
                    
                    const basePath = this.current.substring(0, this.current.lastIndexOf('/') + 1);
                    const fullPath = href.startsWith('/') ? href.substring(1) : basePath + href;
                    
                    this.load(fullPath);
                };
            } else if (href && href.startsWith('#')) {
                link.onclick = (e) => {
                    e.preventDefault();
                    const element = document.getElementById(href.substring(1));
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth' });
                    }
                };
            }
        });
    },

    
    addCopyButtons() {
        
        document.querySelectorAll("#md pre").forEach(pre => {
            if (pre.parentElement.classList.contains('code-block-wrapper')) return;
            
            const wrapper = document.createElement('div');
            wrapper.className = 'code-block-wrapper';
            pre.parentNode.insertBefore(wrapper, pre);
            wrapper.appendChild(pre);
            
           
            if (wrapper.querySelector(".copy-btn")) return;

            const btn = document.createElement("button");
            btn.className = "copy-btn";
            btn.innerHTML = '<i class="far fa-clipboard"></i> Copiar';

            btn.onclick = async (e) => {
                e.stopPropagation();
                
                const codeElement = pre.querySelector('code') || pre;
                const code = codeElement.innerText || codeElement.textContent;
                
                try {
                    await navigator.clipboard.writeText(code);
                    
                    btn.classList.add('copied');
                    btn.innerHTML = '<i class="fas fa-check"></i> ¡Copiado!';
                    
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="far fa-clipboard"></i> Copiar';
                    }, 2000);
                    
                } catch (err) {
                    btn.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error';
                    btn.style.background = "#dc2626";
                    
                    setTimeout(() => {
                        btn.innerHTML = '<i class="far fa-clipboard"></i> Copiar';
                        btn.style.background = "";
                    }, 2000);
                }
            };

            wrapper.appendChild(btn);
        });
    },

    filter() {
        const text = document.getElementById("search").value.toLowerCase().trim();
        const items = document.querySelectorAll(".nav-item");
        let visibleCount = 0;

        items.forEach(item => {
            const matches = text === "" || item.innerText.toLowerCase().includes(text);
            item.style.display = matches ? "block" : "none";
            if (matches) visibleCount++;
        });

        const menu = document.getElementById("menu");
        const noResults = document.getElementById("no-results");
        
        if (visibleCount === 0 && text.length > 0) {
            if (!noResults) {
                const msg = document.createElement("div");
                msg.id = "no-results";
                msg.innerText = `🔍 No se encontraron secciones que contengan "${text}"`;
                menu.appendChild(msg);
            }
        } else if (noResults) {
            noResults.remove();
        }
    }
};


window.onload = async () => {
    const page = location.hash.replace("#", "") || "README.md";
    
    try {
        await App.load(page);
    } catch (error) {
        // Solo mostramos error, sin crear archivos de ejemplo
        console.error('Error al cargar la página:', error);
    }
    
    App.initScrollListener();
    
    // Atajo de teclado Ctrl+K para buscar
    document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('search').focus();
        }
    });
};

window.onpopstate = () => {
    const page = location.hash.replace("#", "") || "README.md";
    App.load(page);
};

window.onresize = () => {
    if (window.innerWidth >= 1024) {
        document.getElementById('sidebar').classList.remove('active');
        document.getElementById('menu-toggle').classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    }
};
</script>

</body>
</html>
