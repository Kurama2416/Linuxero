<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description"
    content="Linuxero: comandos esenciales y soluciones a errores en Linux (Ubuntu, Fedora, Arch).">
  <title>Linuxero Wiki</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐧%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f172a;
      --side: #020617;
      --card: #1e293b;
      --elev: #334155;
      --text: #e2e8f0;
      --muted: #a8b5c8;
      --border: #334155;
      --accent: #fb923c;
      --accent-bg: #c2410c;
      --accent-soft: rgba(251, 146, 60, .16);
      --code: #fcd34d;
      --pre: #0b1220;
      --ok: #047857;
      --err: #f87171;
      --r: 12px;
      --sw: 300px
    }

    @media(prefers-color-scheme:light) {
      :root {
        --bg: #f1f5f9;
        --side: #fff;
        --card: #fff;
        --elev: #e2e8f0;
        --text: #0f172a;
        --muted: #475569;
        --border: #cbd5e1;
        --accent: #c2410c;
        --accent-soft: rgba(194, 65, 12, .1);
        --code: #9a3412;
        --pre: #f8fafc;
        --err: #b91c1c
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
      margin: 0
    }

    body {
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      background: var(--bg);
      color: var(--text)
    }

    body.lock {
      overflow: hidden
    }

    [hidden] {
      display: none !important
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    button {
      font: inherit;
      color: inherit;
      cursor: pointer
    }

    code,
    pre {
      font-family: ui-monospace, "SF Mono", "Fira Code", Menlo, Consolas, monospace
    }

    #progress {
      position: fixed;
      inset: 0 auto auto 0;
      height: 3px;
      width: 0;
      background: var(--accent-bg);
      z-index: 30
    }

    #app {
      display: flex;
      height: 100dvh
    }

    /* Menú lateral */
    #sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: min(var(--sw), 86vw);
      background: var(--side);
      border-right: 1px solid var(--border);
      padding: 72px 14px 16px;
      overflow-y: auto;
      z-index: 20;
      transform: translateX(-100%);
      visibility: hidden;
      transition: transform .25s, visibility 0s .25s
    }

    #sidebar.open {
      transform: none;
      visibility: visible;
      transition-delay: 0s
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .6);
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    #overlay.open {
      opacity: 1;
      pointer-events: auto
    }

    #menu-toggle {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 25;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: var(--r);
      background: var(--accent-bg);
      display: grid;
      place-content: center;
      gap: 5px
    }

    #menu-toggle span {
      display: block;
      width: 24px;
      height: 2px;
      background: #fff;
      border-radius: 2px;
      transition: .2s
    }

    #menu-toggle[aria-expanded=true] span:nth-child(1) {
      transform: translateY(7px) rotate(45deg)
    }

    #menu-toggle[aria-expanded=true] span:nth-child(2) {
      opacity: 0
    }

    #menu-toggle[aria-expanded=true] span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg)
    }

    @media(min-width:1024px) {
      #sidebar {
        position: static;
        transform: none;
        visibility: visible;
        width: var(--sw);
        flex: none;
        padding-top: 20px
      }

      #menu-toggle,
      #overlay {
        display: none
      }

      #content {
        padding: 48px 56px !important
      }
    }

    #brand {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      padding: 6px 4px
    }

    #brand::before {
      content: "🐧";
      font-size: 20px
    }

    .search {
      position: relative;
      margin: 14px 0
    }

    #search {
      width: 100%;
      padding: 11px 40px 11px 12px;
      background: var(--elev);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px
    }

    #search::placeholder {
      color: var(--muted)
    }

    #clear {
      position: absolute;
      right: 2px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border: 0;
      background: none;
      color: var(--muted)
    }

    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-left: 3px solid transparent;
      background: none;
      color: var(--muted);
      padding: 10px 12px;
      margin: 2px 0;
      border-radius: 8px;
      min-height: 44px;
      font-size: 14px
    }

    .nav-item.h1,
    .nav-item.h3 {
      color: var(--accent);
      font-weight: 700;
      font-size: 15px;
      margin-top: 10px
    }

    .nav-item.h2 {
      padding-left: 26px
    }

    .nav-item:hover,
    .nav-item[aria-current=true] {
      background: var(--accent-soft);
      color: var(--text);
      border-left-color: var(--accent)
    }

    .nav-item.h1:hover,
    .nav-item.h1[aria-current=true],
    .nav-item.h3:hover,
    .nav-item.h3[aria-current=true] {
      color: var(--accent)
    }

    #no-results {
      color: var(--muted);
      text-align: center;
      padding: 20px 8px
    }

    /* Contenido */
    #content {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 72px 12px 24px
    }

    #md {
      max-width: 960px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 16px;
      overflow-wrap: anywhere
    }

    @media(min-width:769px) {
      #md {
        padding: 40px 48px
      }
    }

    #md>:first-child {
      margin-top: 0
    }

    #md :is(h1, h2, h3, h4, h5, h6) {
      line-height: 1.25;
      scroll-margin-top: 12px
    }

    #md h1,
    #md h2 {
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: .3em
    }

    #md h1 {
      font-size: 1.9em;
      margin: 1.4em 0 .6em
    }

    #md h2 {
      font-size: 1.45em;
      margin: 1.6em 0 .6em
    }

    #md h3 {
      font-size: 1.2em;
      margin: 1.4em 0 .5em
    }

    #md p,
    #md ul,
    #md ol,
    #md blockquote {
      margin: 0 0 1em
    }

    #md ul,
    #md ol {
      padding-left: 1.6em
    }

    #md a {
      color: var(--accent);
      text-underline-offset: 2px
    }

    #md img {
      max-width: 100%;
      height: auto
    }

    #md hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 1.6em 0
    }

    #md blockquote {
      border-left: 4px solid var(--accent);
      background: var(--elev);
      color: var(--muted);
      padding: .6em 1em;
      border-radius: 0 8px 8px 0
    }

    #md :not(pre)>code {
      background: var(--elev);
      color: var(--code);
      padding: .15em .4em;
      border-radius: 5px;
      font-size: .9em
    }

    .code {
      position: relative;
      margin: 1.2em 0
    }

    #md pre {
      margin: 0;
      padding: 42px 16px 14px;
      background: var(--pre);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      font-size: 14px;
      line-height: 1.6
    }

    .code-actions {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      padding: 6px
    }

    .copy {
      border: 1px solid var(--border);
      background: var(--elev);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      min-height: 32px;
      transition: background .15s, border-color .15s, transform .15s
    }

    .copy:hover {
      border-color: var(--accent)
    }

    .copy:active {
      transform: translateY(1px)
    }

    .copy:first-child {
      border-color: var(--accent)
    }

    .copy:first-child:hover {
      background: var(--accent-bg);
      border-color: var(--accent-bg);
      color: #fff;
      transform: translateY(-1px)
    }

    .copy.ok,
    .copy.ok:hover {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
      transform: none
    }

    @media(hover:hover) {
      .code-actions {
        opacity: .65;
        transition: opacity .15s
      }

      .code:hover .code-actions,
      .code:focus-within .code-actions {
        opacity: 1
      }
    }

    #md table {
      border-collapse: collapse;
      width: 100%;
      margin: 0 0 1em;
      display: block;
      overflow-x: auto
    }

    #md th,
    #md td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
      vertical-align: top
    }

    #md th {
      background: var(--elev)
    }

    @media(max-width:768px) {

      #md table,
      #md tbody,
      #md tr,
      #md td {
        display: block
      }

      #md thead {
        display: none
      }

      #md tr {
        border: 1px solid var(--border);
        border-radius: var(--r);
        padding: 8px 12px;
        margin-bottom: 14px
      }

      #md td {
        border: 0;
        padding: 6px 0
      }

      #md td[data-label]::before {
        content: attr(data-label);
        display: block;
        font-size: .85em;
        font-weight: 700;
        color: var(--accent)
      }
    }

    .state {
      text-align: center;
      color: var(--muted);
      padding: 48px 0
    }

    .error {
      border: 1px solid var(--err);
      border-radius: var(--r);
      padding: 24px;
      text-align: center
    }

    #md .error h2 {
      color: var(--err);
      border: 0;
      margin-top: 0
    }

    .error button {
      background: var(--accent-bg);
      color: #fff;
      border: 0;
      border-radius: 10px;
      padding: 10px 20px;
      margin-top: 8px
    }

    #top {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: var(--accent-bg);
      color: #fff;
      font-size: 22px;
      z-index: 10;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .35)
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }
  </style>
</head>

<body>
  <div id="progress"></div>
  <button id="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="sidebar"
    aria-expanded="false"><span></span><span></span><span></span></button>
  <div id="overlay"></div>

  <div id="app">
    <aside id="sidebar" aria-label="Navegación">
      <a id="brand" href="#README.md">Linuxero</a>
      <div class="search">
        <input id="search" type="text" autocomplete="off" aria-label="Buscar sección"
          placeholder="Buscar sección… (Ctrl+K o /)">
        <button id="clear" type="button" aria-label="Limpiar búsqueda" hidden>✕</button>
      </div>
      <nav id="menu" aria-label="Secciones del documento"></nav>
      <p id="no-results" hidden></p>
    </aside>

    <main id="content" tabindex="-1">
      <!-- #top va antes de #md: si un título genera el id "top", $() sigue encontrando este botón primero -->
      <button id="top" type="button" aria-label="Volver arriba" hidden>↑</button>
      <article id="md"></article>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const BASE = new URL('./', location.href), ROOT = BASE.pathname;
    const smooth = () => matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth';
    const plain = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const fold = s => plain(s).replace(/^-+/, '');
    // Slug estilo GitHub: minúsculas, sin signos ni emojis, espacios a guiones (conserva tildes)
    const slug = s => s.toLowerCase().replace(/[^\p{L}\p{N}\s_-]/gu, '').replace(/\s/g, '-');

    const App = {
      cache: {}, current: 'README.md', req: 0, timer: null,

      init() {
        $('menu-toggle').addEventListener('click', () => this.setMenu(!$('sidebar').classList.contains('open')));
        $('overlay').addEventListener('click', () => this.setMenu(false));
        $('search').addEventListener('input', () => {
          $('clear').hidden = !$('search').value;
          clearTimeout(this.timer);
          this.timer = setTimeout(() => this.filter(), 150);
        });
        $('clear').addEventListener('click', () => { this.resetSearch(); $('search').focus(); });
        $('top').addEventListener('click', () => $('content').scrollTo({ top: 0, behavior: smooth() }));
        $('content').addEventListener('scroll', () => {
          const c = $('content'), max = c.scrollHeight - c.clientHeight;
          $('progress').style.width = (max > 0 ? c.scrollTop / max * 100 : 0) + '%';
          $('top').hidden = c.scrollTop < 300;
        });

        // Deslizar hacia la izquierda sobre el menú lo cierra
        let x0 = 0;
        $('sidebar').addEventListener('touchstart', e => { x0 = e.changedTouches[0].clientX; }, { passive: true });
        $('sidebar').addEventListener('touchend', e => { if (e.changedTouches[0].clientX - x0 < -60) this.setMenu(false); }, { passive: true });

        // Ctrl/Cmd+K o "/" enfocan el buscador del menú. Ctrl+F queda para el navegador.
        addEventListener('keydown', e => {
          const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
          if (((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !typing)) {
            e.preventDefault(); this.setMenu(true); $('search').focus();
          } else if (e.key === 'Escape') {
            this.setMenu(false);
            if (document.activeElement === $('search')) $('search').blur();
          }
        });
        matchMedia('(min-width:1024px)').addEventListener('change', e => e.matches && this.setMenu(false));
        addEventListener('popstate', () => this.load(this.fromHash(), { push: false }));
        this.load(this.fromHash(), { push: false });
      },

      setMenu(open) {
        if (open && innerWidth >= 1024) return;
        $('sidebar').classList.toggle('open', open);
        $('overlay').classList.toggle('open', open);
        $('menu-toggle').setAttribute('aria-expanded', open);
        $('menu-toggle').setAttribute('aria-label', open ? 'Cerrar menú' : 'Abrir menú');
        document.body.classList.toggle('lock', open);
      },

      // ---- Rutas ----
      hashPath() { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } },
      valid(p) { return /\.md$/i.test(p) && !/^[\\/]|\.\.|:|[<>"'`\\]/.test(p); },
      fromHash() {
        let p = this.hashPath();
        if (p && !/\.md$/i.test(p)) p += '.md';
        return this.valid(p) ? p : 'README.md';
      },
      // Convierte un enlace .md (relativo, absoluto del sitio o de GitHub) en una ruta del wiki
      resolve(href) {
        let u;
        try { u = new URL(href, new URL(this.current, BASE)); } catch { return null; }
        const gh = u.href.match(/^https:\/\/github\.com\/[^/]+\/Linuxero\/blob\/[^/]+\/(.+?\.md)(#.*)?$/i);
        if (gh) return { path: decodeURIComponent(gh[1]), hash: gh[2] || '' };
        if (u.origin === location.origin && u.pathname.startsWith(ROOT) && /\.md$/i.test(u.pathname))
          return { path: decodeURIComponent(u.pathname.slice(ROOT.length)), hash: u.hash };
        return null;
      },

      // ---- Carga ----
      async load(path, { push = true, anchor = '' } = {}) {
        if (!this.valid(path)) path = 'README.md';
        this.current = path;
        if (push && this.hashPath() !== path) history.pushState(null, '', '#' + encodeURI(path));
        this.setMenu(false);
        const id = ++this.req;
        try {
          let text = this.cache[path];
          if (text == null) {
            $('md').innerHTML = '<p class="state">Cargando documento…</p>';
            const res = await fetch(encodeURI(path));
            if (!res.ok) throw new Error(`No se encontró «${path}» (HTTP ${res.status}).`);
            text = await res.text();
            this.cache[path] = text;
          }
          if (id !== this.req) return;
          this.render(text, anchor);
        } catch (err) {
          if (id === this.req) this.showError(err);
        }
      },

      // El mensaje se inserta con textContent: nada de lo que venga de la URL se interpreta como HTML
      showError(err) {
        const box = document.createElement('div'); box.className = 'error';
        const h = document.createElement('h2'); h.textContent = 'No se pudo cargar el documento';
        const p = document.createElement('p');
        p.textContent = err.message + (location.protocol === 'file:'
          ? ' El navegador bloquea fetch con file://. Sirve la carpeta con «python3 -m http.server» o usa GitHub Pages.' : '');
        const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Volver al inicio';
        b.addEventListener('click', () => this.load('README.md'));
        box.append(h, p, b);
        $('md').replaceChildren(box);
      },

      render(text, anchor) {
        // Se sanea una sola vez, sobre el HTML ya generado (nunca sobre el Markdown crudo)
        $('md').innerHTML = DOMPurify.sanitize(marked.parse(text, { gfm: true }));
        this.assignIds(); this.buildMenu(); this.links(); this.copyButtons(); this.tables(); this.resetSearch();
        const h1 = $('md').querySelector('h1');
        document.title = (h1 ? h1.textContent.trim() + ' · ' : '') + 'Linuxero Wiki';
        const el = anchor && this.findAnchor(anchor);
        if (el) el.scrollIntoView(); else $('content').scrollTop = 0;
        $('content').dispatchEvent(new Event('scroll'));
      },

      assignIds() {
        const used = new Set();
        $('md').querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h => {
          const base = slug(h.textContent) || 'seccion';
          let id = base, n = 1;
          while (used.has(id)) id = `${base}-${n++}`;
          used.add(id); h.id = id;
        });
      },

      // Acepta #ids codificados y tolera diferencias de tildes o guion inicial
      findAnchor(raw) {
        let a = raw; try { a = decodeURIComponent(raw); } catch { }
        const all = [...$('md').querySelectorAll('[id]')], f = fold(a);
        return all.find(e => e.id === a) || all.find(e => fold(e.id) === f) || null;
      },

      buildMenu() {
        const menu = $('menu'); menu.replaceChildren();
        // h1 y h3 = categorías, h2 = comandos. Si tus categorías usan otro nivel, cambia este selector.
        $('md').querySelectorAll('h1,h2,h3').forEach(h => {
          const t = h.textContent.trim(); if (!t) return;
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'nav-item ' + h.tagName.toLowerCase(); b.textContent = t;
          b.addEventListener('click', () => {
            h.scrollIntoView({ behavior: smooth(), block: 'start' });
            menu.querySelectorAll('.nav-item').forEach(n => n.removeAttribute('aria-current'));
            b.setAttribute('aria-current', 'true');
            this.setMenu(false);
          });
          menu.append(b);
        });
        if (!menu.children.length) {
          const p = document.createElement('p'); p.id = 'no-sections'; p.className = 'state'; p.textContent = 'Este documento no tiene secciones.';
          menu.append(p);
        }
      },

      links() {
        $('md').querySelectorAll('a[href]').forEach(a => {
          const href = a.getAttribute('href');
          if (href.startsWith('#')) {
            a.addEventListener('click', e => {
              e.preventDefault();
              const el = this.findAnchor(href.slice(1));
              if (el) el.scrollIntoView({ behavior: smooth() });
            });
            return;
          }
          const doc = this.resolve(href);
          if (doc) {
            a.href = '#' + encodeURI(doc.path);
            a.addEventListener('click', e => {
              if (e.metaKey || e.ctrlKey || e.shiftKey) return;
              e.preventDefault();
              this.load(doc.path, { anchor: doc.hash.slice(1) });
            });
          } else if (/^https?:/i.test(a.href) && new URL(a.href).origin !== location.origin) {
            a.target = '_blank'; a.rel = 'noopener noreferrer';
          }
        });
      },

      // ---- Copiar ----
      // "Copiar" quita comentarios (conserva #! y la sangría); "Original" copia el texto tal cual
      stripComments(raw) {
        return raw.split('\n').map(l => {
          if (/^\s*#(?!!)/.test(l)) return null;
          for (const m of l.matchAll(/\s#/g)) {
            const pre = l.slice(0, m.index);
            if ((pre.match(/'/g) || []).length % 2 === 0 && (pre.match(/"/g) || []).length % 2 === 0) return pre.trimEnd();
          }
          return l.trimEnd();
        }).filter(l => l !== null).join('\n').replace(/^\n+|\n+$/g, '');
      },

      copyBtn(label, text, title) {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy'; b.textContent = label; b.title = title;
        b.addEventListener('click', async () => {
          try { await navigator.clipboard.writeText(text); b.textContent = '¡Copiado!'; b.classList.add('ok'); }
          catch { b.textContent = 'No se pudo copiar'; }
          setTimeout(() => { b.textContent = label; b.classList.remove('ok'); }, 1800);
        });
        return b;
      },

      copyButtons() {
        $('md').querySelectorAll('pre').forEach(pre => {
          const raw = (pre.querySelector('code') || pre).textContent.replace(/\n$/, '');
          const wrap = document.createElement('div'); wrap.className = 'code';
          const bar = document.createElement('div'); bar.className = 'code-actions';
          bar.append(
            this.copyBtn('Copiar', this.stripComments(raw), 'Copia sin comentarios'),
            this.copyBtn('Original', raw, 'Copia el texto tal cual')
          );
          pre.replaceWith(wrap); wrap.append(pre, bar);
        });
      },

      tables() {
        $('md').querySelectorAll('table').forEach(t => {
          const hs = [...t.querySelectorAll('thead th')].map(th => th.textContent.trim());
          t.querySelectorAll('tbody tr').forEach(r => r.querySelectorAll('td').forEach((td, i) => hs[i] && td.setAttribute('data-label', hs[i])));
        });
      },

      // ---- Búsqueda en el menú ----
      resetSearch() { $('search').value = ''; $('clear').hidden = true; this.filter(); },
      filter() {
        const raw = $('search').value.trim(), q = plain(raw);
        let n = 0;
        document.querySelectorAll('#menu .nav-item').forEach(i => {
          const ok = !q || plain(i.textContent).includes(q);
          i.hidden = !ok; if (ok) n++;
        });
        $('no-results').hidden = !(q && !n);
        $('no-results').textContent = `Sin resultados para «${raw}»`;
      }
    };

    App.init();
  </script>
</body>

</html>
